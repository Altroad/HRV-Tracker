<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Full-bleed background: iOS and Android apply their own rounded mask -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="0.55" stop-color="#0a1620"/>
      <stop offset="1" stop-color="#06101a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Recovery ring: track, then a ~78% arc starting at 12 o'clock -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="64"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"
          stroke-dasharray="1470 1885" transform="rotate(-90 512 512)"/>

  <!-- HRV wave crossing the ring, ending in a ringed reading dot -->
  <path d="M 300 560 C 352 560 362 470 410 470 C 460 470 466 612 516 612 C 568 612 576 430 632 430"
        fill="none" stroke="url(#wave)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="632" cy="430" r="64" fill="#0a1620" stroke="#22d3ee" stroke-width="22"/>
  <circle cx="632" cy="430" r="30" fill="#ffffff"/>
</svg>
